<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Beatframe Studio{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/icon.png">
  <link rel="stylesheet" href="/static/style.css?v=3">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><span class="dot"></span>Beatframe <em>Studio</em></a>
    <nav><a href="/">Videos</a></nav>
  </header>
  <main>{% block body %}{% endblock %}</main>
  <script>
    // copy buttons: <button data-copy="#id">
    document.addEventListener("click", e => {
      const b = e.target.closest("[data-copy]");
      if (!b) return;
      const el = document.querySelector(b.dataset.copy);
      navigator.clipboard.writeText(el.value ?? el.textContent);
      const t = b.textContent; b.textContent = "Copied"; setTimeout(() => b.textContent = t, 1200);
    });
  </script>
</body>
</html>
