title: The Memory That Never Happened
description: 'You''re about to see eight words. Afterward, one question. Your answer might surprise you.


  Memory doesn''t work like a recording. Each time you remember, your brain rebuilds the moment, and sometimes
  it adds things that were never there. In this video we test it on you, then look at two classic experiments:
  Roediger & McDermott''s word lists (1995) and Loftus & Palmer''s car-crash study (1974), where a single
  word in a question changed what people remembered seeing.


  Sources:

  • Roediger, H. L., & McDermott, K. B. (1995). Creating false memories: Remembering words not presented
  in lists. Journal of Experimental Psychology: Learning, Memory, and Cognition.

  • Loftus, E. F., & Palmer, J. C. (1974). Reconstruction of automobile destruction. Journal of Verbal
  Learning and Verbal Behavior.

  • Schacter, D. L., & Addis, D. R. (2007). The cognitive neuroscience of constructive memory. Philosophical
  Transactions of the Royal Society B.

  '
