title: Why Time Speeds Up As You Get Older
description: 'When you were five, one year was a fifth of your whole life. At fifty it is two percent.
  But the bigger reason time speeds up is your memory: your brain records new experiences in detail and
  squeezes routine days into almost nothing. Looking back, a month full of new things feels long, and
  a month of the same routine disappears.


  Based on the "proportional" theory of time perception and research on memory and novelty (the holiday
  paradox, described by psychologist Claudia Hammond).

  '
