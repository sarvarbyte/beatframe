title: You Can't Lift Your Ring Finger
description: 'Put your hand flat on a table, fold your middle finger under, and try to lift your ring
  finger. It barely moves. The tendons that lift your middle and ring fingers are tied together, so when
  the middle one is folded, the ring finger is held down with it.


  Could you lift it? Yes or no?


  Based on hand anatomy: the extensor tendons of the middle and ring fingers are linked by bands called
  juncturae tendinum.

  '
