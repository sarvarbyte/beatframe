title: You're Looking at Your Nose Right Now
description: 'Your nose is in your view every second you are awake. Close one eye and look down: there
  it is. Your brain edits it out because it never moves, so you only see the version of the world your
  brain has cleaned up.


  Did you see your nose just now? Yes or no?


  Based on sensory adaptation: the brain stops reporting things that never change.

  '
tags:
- perception
- brain
- vision
- optical illusion
- human body
- psychology
- shorts
