title: You've Never Heard Your Real Voice
description: 'You have never heard your voice the way everyone else hears it. Plug your ears and hum:
  it gets louder, because the sound is travelling through your skull. Your bones add a deep bass that
  only you can hear. The recording that sounds wrong? That is your real voice.


  Did it get louder when you plugged your ears? Yes or no?


  Based on bone conduction: you hear your own voice through air and through your skull, which boosts low
  frequencies.

  '
