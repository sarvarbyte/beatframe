title: Your Brain Edits Everything You See
description: 'Your brain edits everything you see. It paints in detail your eyes never captured, fills
  a hole in your vision, blacks out your sight three times a second, hides things right in front of you,
  and shows you a prediction instead of the present. This is how, and why.


  Try it: hold your thumb at arm''s length (only the nail is sharp), and look from one eye to the other
  in a mirror (you will never see your eyes move).


  Sources:

  • Koch et al. (2006), "How much the eye tells the brain", Current Biology 16(14)

  • Zheng & Meister (2024), "The unbearable slowness of being: Why do we live at 10 bits/s?", Neuron

  • Ramachandran (1992), "Blind spots", Scientific American 266(5)

  • Simons & Chabris (1999), "Gorillas in our midst", Perception 28

  • Simons & Levin (1998), "Failure to detect changes to people during a real-world interaction", Psychonomic
  Bulletin & Review 5

  • Nijhawan (1994), "Motion extrapolation in catching", Nature 370

  • Raichle & Gusnard (2002), "Appraising the brain''s energy budget", PNAS 99(16)

  • Anil Seth (2021), Being You: A New Science of Consciousness

  The "more than an hour a day" figure is a rough estimate from typical saccade rates and durations.


  Narration: AI voice. Animated with Manim.

  '
tags:
- brain
- perception
