[project]
name = "beatframe"
version = "0.1.0"
description = "Turn a narration script into an animated Manim documentary, beat by beat."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "manim>=0.18",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "edge-tts>=6.1",
]

[project.scripts]
beatframe = "beatframe.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beatframe*"]

[tool.setuptools.package-data]
beatframe = ["assets/fonts/*.ttf"]
