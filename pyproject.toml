[project]
name = "beatframe"
version = "0.1.0"
description = "Turn a narration script into an animated Manim documentary, beat by beat."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "manim>=0.18",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "edge-tts>=6.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "google-api-python-client>=2.120",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
audit = ["google-genai>=1.0"]   # beatframe audit (Gemini)
whisper = ["faster-whisper>=1.0"]   # word timings for your own recordings (voice.provider: files)
dev = ["pytest>=8"]

[project.scripts]
beatframe = "beatframe.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beatframe*"]

[tool.setuptools.package-data]
beatframe = ["assets/fonts/*.ttf", "web/templates/*.html", "web/static/*", "web/static/scenes/*"]

[tool.pytest.ini_options]
markers = ["slow: renders real Manim clips (a few seconds)"]
